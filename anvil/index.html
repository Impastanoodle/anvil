<script>/* apply the saved UI theme before the first paint so a dark session does not flash light */
(function () { try { if (localStorage.getItem('anvil.theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) { } })();</script>

" stroke-linejoin="round" points="21.5,13.5 61.5,13.5 59,16.5 19,16.5"/><polygon fill="#2c333c" stroke="#2c333c" stroke-width="0.35" stroke-linejoin="round" points="51.5,14.2 55.2,14.2 54.4,15.8 50.7,15.8"/><polygon fill="#e1e6ec" stroke="#e1e6ec" stroke-width="0.35" stroke-linejoin="round" points="2,19.5 21.5,13.5 19,16.5"/><polygon fill="#b9c2cc" stroke="#b9c2cc" stroke-width="0.35" stroke-linejoin="round" points="2,19.5 19,16.5 22,16.5 23,21.5 12,20.8"/><polygon fill="#636d79" stroke="#636d79" stroke-width="0.35" stroke-linejoin="round" points="2,19.5 12,20.8 23,21.5 23,27.5 17.5,25 10.5,22.3"/></svg></div><span id="brand">Anvil</span>
    <ul id="menus"></ul>
    <div id="std-toolbar"><button id="std-new" class="std-btn" aria-label="New (Ctrl+N)"></button><button id="std-open" class="std-btn" aria-label="Open (Ctrl+O)"></button><button id="std-save" class="std-btn" aria-label="Save (Ctrl+S)"></button><button id="std-print" class="std-btn" aria-label="Print"></button><span class="std-sep"></span><button id="std-undo" class="std-btn" aria-label="Undo (Ctrl+Z)"></button><button id="std-redo" class="std-btn" aria-label="Redo (Ctrl+Y)"></button><span class="std-sep"></span><button id="std-select" class="std-btn" aria-label="Select"></button><span class="std-sep"></span><button id="std-rebuild" class="std-btn" aria-label="Rebuild (Ctrl+B)"></button><button id="std-fileprops" class="std-btn" aria-label="File Properties"></button><button id="std-options" class="std-btn" aria-label="Options"></button></div>
    <div id="doc-title">Part1</div>
    <div id="search"><input id="cmd-search" placeholder="Search Commands" aria-label="Search commands"><span id="search-ico"></span></div>
  </div>

  <div id="ribbon">
    <div id="ribbon-buttons"></div>
    <div id="ribbon-tabs"></div>
  </div>

  <div id="main">
    <div id="left">
      <div id="fm-tabs"></div>
      <div id="fm-tree">
        <div id="tree-filter"><span id="filter-ico"></span><input id="tree-filter-input" placeholder="Filter" aria-label="Filter feature tree"></div>
        <div id="tree"></div>
      </div>
      <div id="config-panel" hidden></div>
      <div id="pm" hidden></div>
    </div>

    <div id="viewport">
      <div id="hud"></div>
      <canvas id="triad" width="192" height="192"></canvas>
      <div id="scale-bar" aria-hidden="true"><span id="scale-bar-label"></span><div id="scale-bar-line"></div></div>
      <svg id="dim-layer" aria-hidden="true"></svg>
      <div id="dim-edit" hidden><input type="text" inputmode="decimal" spellcheck="false" autocomplete="off" aria-label="Dimension value"></div>
      <div id="zoom-box" hidden></div>
      <div id="sketch-hint" hidden></div>
      <div id="exit-sketch" hidden></div>
    </div>

    <div id="taskpane">
      <div id="tp-panel" hidden>
        <div id="tp-title"></div>
        <div id="tp-body"></div>
      </div>
      <div id="tp-strip"></div>
    </div>
  </div>

  <div id="statusbar">
    <span id="status-msg">Ready</span>
    <span id="status-coords"></span>
    <span id="status-right"></span>
  </div>
</div>

<div id="modal" hidden>
  <div id="modal-card" role="dialog" aria-modal="true">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-buttons"></div>
  </div>
</div>
