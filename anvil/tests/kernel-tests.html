<style>

  .sub { color: var(--dim); margin-bottom: 14px; }
  #summary { font: 600 15px var(--mono); padding: 10px 14px; border: 1px solid var(--line); background: #fff; margin-bottom: 14px; }
  #summary.ok { border-color: var(--ok); color: var(--ok); }
  #summary.bad { border-color: var(--bad); color: var(--bad); }
  table { border-collapse: collapse; width: 100%; background: #fff; border: 1px solid var(--line); }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  td.st { width: 46px; font: 600 12px var(--mono); }
  tr.ok td.st { color: var(--ok); } tr.bad td.st { color: var(--bad); } tr.pending td.st { color: var(--dim); }
  td.detail { font: 12px var(--mono); color: var(--dim); white-space: pre-wrap; }
  tr.bad td.detail { color: var(--bad); }
  td.ms { width: 60px; text-align: right; font: 12px var(--mono); color: var(--dim); }

<h1>Anvil kernel tests</h1>
<div class="sub">Exercises <code>csg.js</code>, <code>kernel.js</code>, <code>sketch-solver.js</code> and <code>assembly.js</code> headlessly: geometry volumes, profiles, features, exports, errors, script round-trips, and the bundled examples.</div>
<div id="summary">running…</div>
<table>
  <thead><tr><th>Status</th><th>Test</th><th>Detail</th><th>ms</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script src="../csg.js"></script>
<script src="../kernel.js"></script>
<script src="../sketch-solver.js"></script>
<script src="../assembly.js"></script>
<script src="../materials.js"></script>
<script src="../examples/examples.js"></script>
<script src="../drawing.js"></script>
<script>
(function () {
  'use strict';
  var K = Kernel, V = K.vec;
  var results = [], rows = document.getElementById('rows');
  var currentGroup = null;

  // ------------------------------------------------------------------ harness
  function group(name) {
    currentGroup = name;
    var tr = document.createElement('tr');
    tr.className = 'group';
    tr.innerHTML = '<td colspan="4"></td>';
    tr.firstChild.textContent = name;
    rows.appendChild(tr);
  }
  // test(name, fn): fn runs synchronously; if it returns a thenable the row is shown as WAIT and settled when the
  // promise resolves (PASS, string result as detail) or rejects (FAIL). A pending test that has not settled after
  // ASYNC_TIMEOUT_MS fails with "timed out" so a hung worker cannot hang the page. The summary (and
  // window.__anvilTests) is written only after every test, sync and async, has settled.
  var ASYNC_TIMEOUT_MS = 10000, pending = 0, allDeclared = false;
  function errText(e) {
    return (e && e.stack) ? String(e.message || e) + '\n' + String(e.stack).split('\n').slice(1, 3).join('\n') : String(e);
  }
  function test(name, fn) {
    var t0 = performance.now();
    var res = { group: currentGroup, name: name, ok: false, detail: '', ms: 0, pending: false };
    results.push(res);
    var tr = document.createElement('tr');
    tr.innerHTML = '<td class="st"></td><td></td><td class="detail"></td><td class="ms"></td>';
    tr.children[1].textContent = name;
    rows.appendChild(tr);
    function settle(ok, detail) {
      res.ok = ok; res.detail = detail; res.ms = performance.now() - t0; res.pending = false;
      tr.className = ok ? 'ok' : 'bad';
      tr.children[0].textContent = ok ? 'PASS' : 'FAIL';
      tr.children[2].textContent = detail;
      tr.children[3].textContent = res.ms.toFixed(1);
    }
    var r;
    try {
      r = fn();
    } catch (e) {
      settle(false, errText(e));
      return;
    }
    if (r && typeof r.then === 'function') {
      res.pending = true; pending++;
      tr.className = 'pending';
      tr.children[0].textContent = 'WAIT';
      var done = false, timer = null;
      var finishAsync = function (ok, detail) {
        if (done) return;
        done = true; clearTimeout(timer);
        settle(ok, detail);
        pending--;
        maybeSummarize();
      };
      // armed once the page is idle: the synchronous tests declared after this one run first, and a timer armed now
      // could fire before the async work's (already queued) reply is delivered
      setTimeout(function () { if (!done) timer = setTimeout(function () { finishAsync(false, 'timed out after ' + (ASYNC_TIMEOUT_MS / 1000) + ' s (promise never settled)'); }, ASYNC_TIMEOUT_MS); }, 0);
      r.then(function (v) { finishAsync(true, typeof v === 'string' ? v : ''); }, function (e) { finishAsync(false, errText(e)); });
      return;
    }
    settle(true, typeof r === 'string' ? r : '');
  }
  function maybeSummarize() {
    var summary = document.getElementById('summary');
    if (!allDeclared || pending > 0) {
      summary.className = '';
      summary.textContent = 'running… ' + results.length + ' tests declared, ' + pending + ' waiting on async work';
      return;
    }
    var passed = results.filter(function (r) { return r.ok; }).length, total = results.length;
    var totalMs = results.reduce(function (s, r) { return s + r.ms; }, 0);
    summary.className = passed === total ? 'ok' : 'bad';
    summary.textContent = passed + ' / ' + total + ' passed' + (passed === total ? '' : ' — ' + (total - passed) + ' FAILED') + '  ·  ' + totalMs.toFixed(0) + ' ms';
    window.__anvilTests = { passed: passed, total: total, results: results };
  }
  function fail(msg) { throw new Error(msg); }
  function assert(cond, msg) { if (!cond) fail(msg || 'assertion failed'); }
  function near(actual, expected, tol, label) {
    var t = tol == null ? 1e-6 : tol;
    if (!(Math.abs(actual - expected) <= t)) fail((label || 'value') + ' = ' + actual + ', expected ' + expected + ' ±' + t);
  }
  function nearRel(actual, expected, rel, label) {
    near(actual, expected, Math.abs(expected) * rel + 1e-9, label);
  }
  function nearVec(a, b, tol, label) {
    for (var i = 0; i < 3; i++) near(a[i], b[i], tol, (label || 'vec') + '[' + i + ']');
  }
  function fmt(n) { return Math.round(n * 1000) / 1000; }

  // Build a model from script text and return everything a test could want.
  function build(code) {
    var model = K.newModel('Test');
    K.runScript(model, code);
    var b = K.rebuild(model);
    var mesh = K.meshFromBody(b.body);
    var mp = K.massProps(mesh, model.density);
    return { model: model, build: b, body: b.body, mesh: mesh, mp: mp, errors: b.errors, warnings: b.warnings };
  }
  // Assembly counterpart of build(): runs an assembly script (a.insert / a.mate) on a fresh assembly and rebuilds it.
  function buildAsm(code, cache) {
    var model = Assembly.newAssembly();
    Assembly.runScript(model, code);
    var b = Assembly.rebuild(model, cache);
    var mesh = K.meshFromBody(b.body);
    var mp = K.massProps(mesh, 1);
    return { model: model, build: b, body: b.body, mesh: mesh, mp: mp, errors: b.errors, warnings: b.warnings };
  }
  // Design Library entries are parts unless kind: 'assembly' (see examples/examples.js)
  function isAsmExample(ex) { return ex.kind === 'assembly'; }
  function buildExample(ex) {
    if (isAsmExample(ex) && typeof Assembly === 'undefined') fail('assembly.js is not loaded (Assembly is undefined)');
    return isAsmExample(ex) ? buildAsm(ex.code) : build(ex.code);
  }
  // an assembly example's `checks`: [{ component, position, rotation? }] against the solved transforms (1e-6)
  function checkAsmExample(ex, r) {
    (ex.checks || []).forEach(function (c) {
      var comp = Assembly.findComponent(r.model, c.component);
      assert(comp, 'check: no component ' + c.component + ' (have ' + r.model.components.map(function (x) { return x.name; }).join(', ') + ')');
      if (c.position) nearVec(comp.transform.position, c.position, 1e-6, c.component + ' position');
      if (c.rotation) for (var i = 0; i < 9; i++) near(comp.transform.rotation[i], c.rotation[i], 1e-6, c.component + ' rotation[' + i + ']');
    });
    r.build.components.forEach(function (c) { assert(!c.error, c.name + ': ' + c.error); });
    // an example's `interference`: [{ a, b, volume }] must be exactly the pairs Assembly.interference finds (1e-6 rel)
    if (ex.interference) {
      var found = Assembly.interference(r.model, r.build).pairs;
      assert(found.length === ex.interference.length, 'interference pairs: ' + found.map(function (p) { return p.aName + '/' + p.bName; }).join(', ') + ', expected ' + ex.interference.length);
      ex.interference.forEach(function (e) {
        var p = found.filter(function (q) { return (q.aName === e.a && q.bName === e.b) || (q.aName === e.b && q.bName === e.a); })[0];
        assert(p, 'no interference between ' + e.a + ' and ' + e.b);
        nearRel(p.volume, e.volume, 1e-6, e.a + ' ∩ ' + e.b);
      });
    }
  }
  function noErrors(r) {
    var ids = Object.keys(r.errors);
    if (ids.length) fail('rebuild errors: ' + ids.map(function (id) { return id + ': ' + r.errors[id]; }).join(' | '));
  }
  function bboxStr(bb) {
    return '[' + bb.min.map(fmt).join(', ') + '] .. [' + bb.max.map(fmt).join(', ') + ']';
  }
  // Watertightness proxy: the divergence-theorem volume of a closed, outward-oriented mesh equals the sum over
  // faces, and flipping any triangle breaks the match with the polygon-based CSG volume.
  function consistentVolume(r) {
    var pv = r.body.volume();
    nearRel(r.mp.volume, pv, 1e-6, 'mesh volume vs polygon volume');
  }

  // Polygonal approximations: a circle of radius r sampled with n segments has area n/2 r^2 sin(2pi/n).
  function segsForRadius(r) { return Math.max(16, Math.min(72, Math.round(8 * Math.sqrt(Math.max(r, 0.01))))); }
  function polyCircleArea(r) { var n = segsForRadius(r); return n / 2 * r * r * Math.sin(2 * Math.PI / n); }

  // ------------------------------------------------------------------ CSG primitives
  group('csg.js');
  function cube(cx, cy, cz, h) {
    var polys = [];
    var faces = [
      [[0, 4, 6, 2], [-1, 0, 0]], [[1, 3, 7, 5], [1, 0, 0]], [[0, 1, 5, 4], [0, -1, 0]],
      [[2, 6, 7, 3], [0, 1, 0]], [[0, 2, 3, 1], [0, 0, -1]], [[4, 5, 7, 6], [0, 0, 1]]
    ];
    faces.forEach(function (f) {
      var vs = f[0].map(function (i) {
        return new CSG.Vertex(new CSG.Vector(cx + (i & 1 ? h : -h), cy + (i & 2 ? h : -h), cz + (i & 4 ? h : -h)));
      });
      polys.push(new CSG.Polygon(vs));
    });
    return CSG.fromPolygons(polys);
  }
  test('cube volume is positive and exact', function () {
    near(cube(0, 0, 0, 1).volume(), 8, 1e-9, 'volume');
  });
  test('union of overlapping cubes', function () {
    var v = cube(0, 0, 0, 1).union(cube(1, 0, 0, 1)).volume();
    near(v, 8 + 8 - 4, 1e-6, 'volume');
  });
  test('subtract removes the overlap', function () {
    var v = cube(0, 0, 0, 1).subtract(cube(1, 0, 0, 1)).volume();
    near(v, 4, 1e-6, 'volume');
  });
  test('intersect keeps only the overlap', function () {
    var v = cube(0, 0, 0, 1).intersect(cube(1, 0, 0, 1)).volume();
    near(v, 4, 1e-6, 'volume');
  });
  test('union of disjoint cubes keeps both', function () {
    var v = cube(0, 0, 0, 1).union(cube(5, 0, 0, 1)).volume();
    near(v, 16, 1e-6, 'volume');
  });
  test('subtracting a non-touching cube changes nothing', function () {
    var v = cube(0, 0, 0, 1).subtract(cube(5, 0, 0, 1)).volume();
    near(v, 8, 1e-6, 'volume');
  });
  test('coplanar union (cubes sharing a face) is watertight', function () {
    var c = cube(0, 0, 0, 1).union(cube(2, 0, 0, 1));
    near(c.volume(), 16, 1e-6, 'volume');
    var mesh = K.meshFromBody(c);
    near(K.massProps(mesh, 1).volume, 16, 1e-6, 'mesh volume');
  });
  test('transform with reflection keeps outward orientation', function () {
    var m = cube(3, 0, 0, 1).transform(function (p) { return new CSG.Vector(-p.x, p.y, p.z); }, true);
    near(m.volume(), 8, 1e-9, 'volume');
  });
  test('inverse negates the volume', function () {
    near(cube(0, 0, 0, 1).inverse().volume(), -8, 1e-9, 'volume');
  });
  test('Plane.fromVertices tolerates collinear leading vertices', function () {
    var vs = [[0, 0, 0], [1, 0, 0], [2, 0, 0], [2, 1, 0], [0, 1, 0]].map(function (p) { return new CSG.Vertex(new CSG.Vector(p[0], p[1], p[2])); });
    var pl = CSG.Plane.fromVertices(vs);
    assert(pl, 'plane should exist');
    nearVec([pl.normal.x, pl.normal.y, pl.normal.z], [0, 0, 1], 1e-9, 'normal');
  });
  test('Polygon.tryCreate rejects degenerate polygons', function () {
    var vs = [[0, 0, 0], [1, 0, 0], [2, 0, 0]].map(function (p) { return new CSG.Vertex(new CSG.Vector(p[0], p[1], p[2])); });
    assert(CSG.Polygon.tryCreate(vs) === null, 'collinear polygon should be null');
  });

  // ------------------------------------------------------------------ planes and frames
  group('planes');
  test('standard planes are right-handed (x × y = n)', function () {
    ['Front', 'Top', 'Right'].forEach(function (r) {
      var p = K.STD_PLANES[r];
      nearVec(V.cross(p.x, p.y), p.n, 1e-12, r);
    });
  });
  test('to3D / to2D round-trip on every standard plane', function () {
    ['Front', 'Top', 'Right'].forEach(function (r) {
      var pl = K.makePlane(r, 7);
      var w = K.to3D(pl, 3, -4);
      var uv = K.to2D(pl, w);
      near(uv[0], 3, 1e-12, r + ' u'); near(uv[1], -4, 1e-12, r + ' v');
      near(V.dot(V.sub(w, pl.origin), pl.n), 0, 1e-12, r + ' on plane');
      near(V.dot(w, pl.n), 7, 1e-12, r + ' offset');
    });
  });
  test('Top plane maps sketch v to world -z', function () {
    var w = K.to3D(K.makePlane('Top', 0), 0, -5);
    nearVec(w, [0, 0, 5], 1e-12, 'world');
  });
  test('planeFromFace gives an orthonormal frame through the point', function () {
    var pl = K.planeFromFace([1, 1, 0], [2, 2, 9]);
    near(V.len(pl.x), 1, 1e-9, '|x|'); near(V.len(pl.y), 1, 1e-9, '|y|'); near(V.len(pl.n), 1, 1e-9, '|n|');
    near(V.dot(pl.x, pl.y), 0, 1e-9, 'x·y'); near(V.dot(pl.x, pl.n), 0, 1e-9, 'x·n');
    nearVec(V.cross(pl.x, pl.y), pl.n, 1e-9, 'handedness');
    near(V.dot(V.sub([2, 2, 9], pl.origin), pl.n), 0, 1e-9, 'point on plane');
  });
  test('resolvePlane errors on a missing reference plane feature', function () {
    var threw = false;
    try { K.resolvePlane({ featureId: 99 }, K.newModel(), {}); } catch (e) { threw = /not found/i.test(e.message); }
    assert(threw, 'expected "not found" error');
  });

  // ------------------------------------------------------------------ sketch profiles
  group('sketch profiles');
  test('rect entity gives one CCW outer loop', function () {
    var pr = K.sketchProfile({ entities: [{ t: 'rect', x: 0, y: 0, w: 4, h: 2 }] });
    assert(pr.loops.length === 1, 'loops = ' + pr.loops.length);
    assert(!pr.loops[0].hole, 'outer should not be a hole');
    near(K.signedArea(pr.loops[0].pts), 8, 1e-9, 'area');
  });
  test('circle inside rect is detected as a hole', function () {
    var pr = K.sketchProfile({ entities: [{ t: 'rect', x: -10, y: -10, w: 20, h: 20 }, { t: 'circle', cx: 0, cy: 0, r: 3 }] });
    assert(pr.loops.length === 2, 'loops = ' + pr.loops.length);
    var holes = pr.loops.filter(function (l) { return l.hole; });
    assert(holes.length === 1, 'holes = ' + holes.length);
    nearRel(K.signedArea(holes[0].pts), polyCircleArea(3), 1e-9, 'hole area (CCW)');
  });
  test('island inside a hole is solid again (depth 2)', function () {
    var pr = K.sketchProfile({ entities: [
      { t: 'rect', x: -10, y: -10, w: 20, h: 20 }, { t: 'circle', cx: 0, cy: 0, r: 5 }, { t: 'circle', cx: 0, cy: 0, r: 2 }
    ] });
    var depths = pr.loops.map(function (l) { return l.depth; }).sort();
    assert(depths.join(',') === '0,1,2', 'depths = ' + depths.join(','));
    assert(pr.loops.filter(function (l) { return l.hole; }).length === 1, 'exactly one hole');
  });
  test('four lines chain into one closed loop', function () {
    var pr = K.sketchProfile({ entities: [
      { t: 'line', x1: 0, y1: 0, x2: 5, y2: 0 }, { t: 'line', x1: 5, y1: 5, x2: 0, y2: 5 },
      { t: 'line', x1: 5, y1: 0, x2: 5, y2: 5 }, { t: 'line', x1: 0, y1: 5, x2: 0, y2: 0 }
    ] });
    assert(pr.loops.length === 1, 'loops = ' + pr.loops.length);
    near(Math.abs(K.signedArea(pr.loops[0].pts)), 25, 1e-9, 'area');
    assert(pr.warnings.length === 0, 'warnings: ' + pr.warnings.join(' '));
  });
  test('lines and an arc chain into a D-shaped loop', function () {
    var pr = K.sketchProfile({ entities: [
      { t: 'line', x1: 0, y1: -5, x2: 0, y2: 5 }, { t: 'arc', cx: 0, cy: 0, r: 5, a0: -90, a1: 90 }
    ] });
    assert(pr.loops.length === 1, 'loops = ' + pr.loops.length + ' warnings: ' + pr.warnings.join(' '));
    // 180° of a radius-5 arc is sampled with 9 segments, so the chordal area is ~2% under the true half-disc
    nearRel(Math.abs(K.signedArea(pr.loops[0].pts)), Math.PI * 25 / 2, 0.03, 'half-disc area');
  });
  test('an open contour is ignored with a warning', function () {
    var pr = K.sketchProfile({ entities: [{ t: 'line', x1: 0, y1: 0, x2: 5, y2: 0 }, { t: 'line', x1: 5, y1: 0, x2: 5, y2: 5 }] });
    assert(pr.loops.length === 0, 'loops = ' + pr.loops.length);
    assert(pr.warnings.length === 1 && /open contour/i.test(pr.warnings[0]), 'warning: ' + pr.warnings.join(' '));
  });
  test('construction entities do not contribute to the profile', function () {
    var pr = K.sketchProfile({ entities: [{ t: 'rect', x: 0, y: 0, w: 4, h: 2 }, { t: 'circle', cx: 2, cy: 1, r: 0.5, construction: true }] });
    assert(pr.loops.length === 1, 'loops = ' + pr.loops.length);
  });
  test('slot, polygon and centre-rect entities are closed loops with the right area', function () {
    // slot ends are 8-segment half circles (16-gon), so compare with the polygonal area
    var slot = K.sketchProfile({ entities: [{ t: 'slot', x1: 0, y1: 0, x2: 10, y2: 0, w: 4 }] });
    nearRel(K.signedArea(slot.loops[0].pts), 10 * 4 + 16 / 2 * 4 * Math.sin(2 * Math.PI / 16), 1e-6, 'slot area');
    var sl = slot.loops[0].pts, tangent = sl.filter(function (q) { return Math.abs(Math.abs(q[1]) - 2) < 1e-9 && (Math.abs(q[0]) < 1e-9 || Math.abs(q[0] - 10) < 1e-9); });
    assert(tangent.length === 4, 'slot should keep all 4 tangent points where the arcs meet the straight sides (got ' + tangent.length + ')');
    var hex = K.sketchProfile({ entities: [{ t: 'poly', cx: 0, cy: 0, r: 2, n: 6 }] });
    near(K.signedArea(hex.loops[0].pts), 6 / 2 * 4 * Math.sin(Math.PI / 3), 1e-9, 'hexagon area');
    var cr = K.sketchProfile({ entities: [{ t: 'crect', cx: 1, cy: 1, w: 6, h: 4 }] });
    near(K.signedArea(cr.loops[0].pts), 24, 1e-9, 'centre-rect area');
  });
  test('entitySnapPoints returns centre and endpoints', function () {
    var sp = K.entitySnapPoints({ t: 'line', x1: 0, y1: 0, x2: 4, y2: 0 });
    assert(sp.length === 3 && sp[2][0] === 2, 'line snaps: ' + JSON.stringify(sp));
    var cs = K.entitySnapPoints({ t: 'circle', cx: 1, cy: 1, r: 2 });
    assert(cs.length === 5 && cs[0][0] === 1 && cs[1][0] === 3, 'circle snaps: ' + JSON.stringify(cs));
  });

  // ------------------------------------------------------------------ features
  group('features');
  test('box 20×30×10 has the exact volume and bbox', function () {
    var r = build('p.box(20, 30, 10);');
    noErrors(r);
    near(r.mp.volume, 6000, 1e-6, 'volume');
    near(r.mp.area, 2 * (20 * 30 + 20 * 10 + 30 * 10), 1e-6, 'area');
    // p.box sketches on Top with v in [-d, 0]; Top maps v -> -z, so the box occupies z in [0, d]
    nearVec(r.mp.bbox.min, [0, 0, 0], 1e-9, 'bbox.min');
    nearVec(r.mp.bbox.max, [20, 10, 30], 1e-9, 'bbox.max');
    assert(r.mesh.faces.length === 6, 'faces = ' + r.mesh.faces.length);
    consistentVolume(r);
    return 'bbox ' + bboxStr(r.mp.bbox);
  });
  test('centred box is symmetric about the origin in x and z', function () {
    var r = build('p.box(20, 30, 10, { centered: true });');
    noErrors(r);
    nearVec(r.mp.bbox.min, [-10, 0, -15], 1e-9, 'bbox.min');
    nearVec(r.mp.bbox.max, [10, 10, 15], 1e-9, 'bbox.max');
    nearVec(r.mp.centroid, [0, 5, 0], 1e-6, 'centroid');
  });
  test('cylinder r=10 h=5 on Top matches the polygonal volume', function () {
    var r = build('p.cylinder(10, 5);');
    noErrors(r);
    nearRel(r.mp.volume, polyCircleArea(10) * 5, 1e-6, 'volume');
    nearRel(r.mp.volume, Math.PI * 100 * 5, 0.02, 'volume vs true cylinder');
    near(r.mp.bbox.min[1], 0, 1e-9, 'y min'); near(r.mp.bbox.max[1], 5, 1e-9, 'y max');
  });
  test('cylinder along z and along x land on the right axes', function () {
    var rz = build('p.cylinder(4, 9, { axis: "z" });');
    noErrors(rz);
    near(rz.mp.bbox.max[2] - rz.mp.bbox.min[2], 9, 1e-9, 'z extent');
    var rx = build('p.cylinder(4, 9, { axis: "x" });');
    noErrors(rx);
    near(rx.mp.bbox.max[0] - rx.mp.bbox.min[0], 9, 1e-9, 'x extent');
  });

  // The o >= 0 part of the profile loop buildFlange extrudes along an edge (o = outward across the edge, up = along
  // the fold). buildFlange also prepends/appends an overlap strip at o in [-ov, 0] that lies inside the sheet and so
  // adds nothing to the union; it is left out here so area and moment describe the material actually added.
  function flangeProfile(A, R, T, L) {
    var segs = Math.max(4, Math.round(8 * A / (Math.PI / 2)));
    var inner = [], outer = [];
    for (var s = 0; s <= segs; s++) {
      var th = A * s / segs;
      inner.push([R * Math.sin(th), R - R * Math.cos(th)]);
      outer.push([(R + T) * Math.sin(th), R - (R + T) * Math.cos(th)]);
    }
    var tx = Math.cos(A), ty = Math.sin(A);
    var iEnd = [inner[segs][0] + tx * L, inner[segs][1] + ty * L], oEnd = [outer[segs][0] + tx * L, outer[segs][1] + ty * L];
    return inner.concat([iEnd, oEnd], outer.slice().reverse()); // inner[0] = [0, 0], outer[0] = [0, -T]: closed at o = 0
  }
  // shoelace area and first moment about o = 0 (mx = ∫∫ o dA), made positive whatever the loop orientation
  function polyMoments(pts) {
    var a = 0, mx = 0;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], q = pts[(i + 1) % pts.length];
      var c = p[0] * q[1] - q[0] * p[1];
      a += c; mx += (p[0] + q[0]) * c;
    }
    a /= 2; mx /= 6;
    return a < 0 ? { area: -a, mx: -mx } : { area: a, mx: mx };
  }

    for (var i = 0; i < mesh.faces.length; i++) {

      if (Math.abs(Math.abs(d) - 1) < 1e-3) return i;
    }
    return -1;
  }

  function tiltedFaces(mesh) {
    return mesh.faces.filter(function (f) {
      var n = f.normal;
      return !(Math.abs(n[0]) > 0.999999 || Math.abs(n[1]) > 0.999999 || Math.abs(n[2]) > 0.999999);
    });
  }
  function hasFace(mesh, n, w, tol) {
    return mesh.faces.some(function (f) {
      return Math.abs(f.normal[0] - n[0]) < 1e-6 && Math.abs(f.normal[1] - n[1]) < 1e-6 && Math.abs(f.normal[2] - n[2]) < 1e-6 && Math.abs(f.w - w) < tol;
    });
  }

    // Plain oblique cut: a parallelogram slab, removed volume 10 · 14.142 · 2 = 282.843 with centroid z = −39.
    // Normal cut: the top footprint extruded straight through the thickness: the same volume, centroid z = −38.
    var c = Math.SQRT1_2;
    var TILT = 'p.sketch({ custom: true, origin: [50, 10, -30], x: [1, 0, 0], y: [0, ' + c + ', ' + (-c) + '], n: [0, ' + c + ', ' + c + '] }, 0).rect(-5, -5, 10, 10);';

  // ------------------------------------------------------------------ incremental rebuild
  group('rebuild cache');
  test('rebuild(model, cache) reuses the unchanged prefix and rebuilds from the first change', function () {
    var model = K.newModel('C');
    K.runScript(model, 'p.box(60, 40, 20);\np.hole("Top", 30, -20, 10, { offset: 20 });\np.linearPattern({ dir: "x", spacing: 20, count: 2 });\np.fillet(3, [[60, 20, 20]]);');
    var b1 = K.rebuild(model);
    assert(b1.reused === 0 && b1.cache.steps.length === model.features.length, 'first build: nothing reused, one step per feature');
    var v1 = b1.body.volume();
    var b2 = K.rebuild(model, b1.cache);
    assert(b2.reused === model.features.length, 'identical model: everything reused (' + b2.reused + ')');
    near(b2.body.volume(), v1, 1e-9, 'same body');
    // edit the last feature
    model.features[model.features.length - 1].r = 5;
    var b3 = K.rebuild(model, b2.cache);
    assert(b3.reused === model.features.length - 1, 'last feature changed: prefix reused (' + b3.reused + ')');
    var fresh = K.rebuild(JSON.parse(JSON.stringify(model)));
    near(b3.body.volume(), fresh.body.volume(), 1e-9, 'cached rebuild equals a fresh rebuild');
    assert(Object.keys(b3.errors).length === 0, 'no errors');
    // edit the first sketch: nothing reusable
    model.features[0].entities[0].w = 80;
    var b4 = K.rebuild(model, b3.cache);
    assert(b4.reused === 0, 'first feature changed: nothing reused (' + b4.reused + ')');
    near(b4.body.volume(), K.rebuild(JSON.parse(JSON.stringify(model))).body.volume(), 1e-9, 'fresh again');
    // errors and warnings are restored from the cache too
    var m2 = K.newModel('W');
    K.runScript(m2, 'p.box(20, 20, 10);\np.sketch("Top", 10).circle(10, -10, 3).cut(5);\np.box(5, 5, 5, { at: [100, 0, 0] });');
    var c1 = K.rebuild(m2), c2 = K.rebuild(m2, c1.cache);
    assert(JSON.stringify(c2.warnings) === JSON.stringify(c1.warnings) && Object.keys(c1.warnings).length === 1, 'warning restored: ' + JSON.stringify(c2.warnings));
    // sheet parameters are part of every key
    var m3 = K.newModel('S');
    K.runScript(m3, 'p.sheet(2);\np.sketch("Top").rect(0, -60, 100, 60).end().baseFlange(2);\np.flange(20, [[0, 2, 30]]);');
    var s1 = K.rebuild(m3);
    m3.sheet.bendRadius = 4;
    var s2 = K.rebuild(m3, s1.cache);
    assert(s2.reused === 0, 'sheet change invalidates the cache (' + s2.reused + ')');
    assert(Math.abs(s2.body.volume() - s1.body.volume()) > 1, 'bend radius change rebuilt the flange');
  });

  // ------------------------------------------------------------------ CSG bounding-box early-out

  test('getBounds() of a cube is its axis-aligned box', function () {
    var c = cube(0, 0, 0, 5);

    assert(bb && bb.min && bb.max && bb.min.length === 3 && bb.max.length === 3, 'getBounds() must return { min: [x, y, z], max: [x, y, z] }, got ' + JSON.stringify(bb));
    nearVec(bb.min, [-5, -5, -5], 1e-9, 'min'); nearVec(bb.max, [5, 5, 5], 1e-9, 'max');
    return bboxStr(bb);
  });
  test('disjoint cubes: union 2000, subtract 1000, intersect 0, union keeps all 12 quads unsplit', function () {
    var a = cube(0, 0, 0, 5), b = cube(50, 0, 0, 5);
    var u = a.union(b);
    near(u.volume(), 2000, 1e-9, 'union volume');
    near(a.subtract(b).volume(), 1000, 1e-9, 'subtract volume');
    near(a.intersect(b).volume(), 0, 1e-9, 'intersect volume');
    near(b.subtract(a).volume(), 1000, 1e-9, 'subtract the other way');
    assert(u.polygons.length === 12, 'union of two far-apart cubes should keep 6 + 6 quads, got ' + u.polygons.length);
    var bb = u.getBounds();
    nearVec(bb.min, [-5, -5, -5], 1e-9, 'union bounds min'); nearVec(bb.max, [55, 5, 5], 1e-9, 'union bounds max');
    // the union is a proper solid: the mesh agrees with the polygon volume
    near(K.massProps(K.meshFromBody(u), 1).volume, 2000, 1e-6, 'mesh volume');
    return u.polygons.length + ' polygons, bounds ' + bboxStr(bb);
  });
  test('far boss on a plate with a distant hole: volume and centroid are analytic', function () {

  test('a subtract whose tool misses the body leaves the body polygons intact', function () {

  // ------------------------------------------------------------------ cut direction hint
  // Kernel.cutDirectionHint(model, sketchId, body): true = a new cut on that sketch should be reversed to go into
  // the body, false = forward already goes into it, null = undetermined (no body, the probe along the sketch normal
  // misses the body, the sketch plane lies inside the material, unknown sketch). It never throws.
  group('cut direction hint');
  var SHEET_FRONT = 'p.sketch("Front").rect(0, 0, 100, 60).extrude(2);\n'; // z ∈ [0, 2], n = +Z
  function hintFor(code, sketchCode) {

    noErrors(r);
    var sk = r.model.features.filter(function (f) { return f.type === 'sketch'; }).pop();

  test('sketch on the bottom face (Front offset 0, normal into the sheet): false', function () {

  // Mirrors the "Sheet Metal Bracket" entry of EXAMPLES in ui-app.js (this page does not load the UI).

    'p.sheet(2, 2, 0.71);\n' +

  function firstVertex(c) { var p = c.toPolygons()[0].vertices[0].pos; return [p.x, p.y, p.z]; }
  function cloneOf(o) { return JSON.parse(JSON.stringify(o)); }
  function keysOf(o) { return Object.keys(o || {}).sort().join(','); }
  test('CSG.pack / unpack round-trips a boolean result exactly', function () {
    var r = build('p.box(40, 30, 20);\np.hole("Top", 20, -15, 8, { offset: 20 });');
    noErrors(r);
    var c = r.body, packed = c.pack();
    assert(packed && typeof packed === 'object' && !(packed instanceof CSG), 'pack() must return a plain object, got ' + Object.prototype.toString.call(packed));
    var u = CSG.unpack(packed);

    var cp = c.toPolygons(), up = u.toPolygons();
    assert(up.length === cp.length, 'polygon count ' + up.length + ' vs ' + cp.length);
    nearVec(firstVertex(u), firstVertex(c), 0, 'first vertex');
    for (var i = 0; i < cp.length; i++) {

  // ------------------------------------------------------------------ CSG: splitting only inside the overlap region
  // csg.js splits polygons only where the operands' bounding boxes overlap. Every boolean below has an analytic
  // volume; the result must also mesh watertight (mesh volume = polygon volume) and hold no degenerate polygons.
  group('csg overlap split');
  function boxCSG(x0, y0, z0, x1, y1, z1) {
    var P = function (x, y, z) { return new CSG.Vertex(new CSG.Vector(x, y, z)); };
    var q = function (a, b, c, d) { return new CSG.Polygon([a, b, c, d]); };
    return CSG.fromPolygons([
      q(P(x0, y0, z0), P(x0, y0, z1), P(x0, y1, z1), P(x0, y1, z0)), q(P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1)),
      q(P(x0, y0, z0), P(x1, y0, z0), P(x1, y0, z1), P(x0, y0, z1)), q(P(x0, y1, z0), P(x0, y1, z1), P(x1, y1, z1), P(x1, y1, z0)),
      q(P(x0, y0, z0), P(x0, y1, z0), P(x1, y1, z0), P(x1, y0, z0)), q(P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1))
    ]);
  }
  // an n-sided prism about a z-parallel axis through (cx, cy), z in [z0, z1], vertex 0 at angle 0
  function prismCSG(cx, cy, r, z0, z1, n) {
    var polys = [], bot = [], top = [];
    for (var i = 0; i < n; i++) {
      var a = 2 * Math.PI * i / n;
      bot.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
    var P = function (p, z) { return new CSG.Vertex(new CSG.Vector(p[0], p[1], z)); };
    for (i = 0; i < n; i++) {
      var p0 = bot[i], p1 = bot[(i + 1) % n];
      polys.push(new CSG.Polygon([P(p0, z0), P(p1, z0), P(p1, z1), P(p0, z1)]));
      top.push(P(bot[i], z1));
    }
    polys.push(new CSG.Polygon(top));
    polys.push(new CSG.Polygon(bot.slice().reverse().map(function (p) { return P(p, z0); })));
    return CSG.fromPolygons(polys);
  }
  function ngonArea(r, n) { return n / 2 * r * r * Math.sin(2 * Math.PI / n); }
  function polyArea3(poly) {
    var vs = poly.vertices, n = poly.plane.normal, s = new CSG.Vector(0, 0, 0);
    for (var i = 0; i < vs.length; i++) s = s.plus(vs[i].pos.cross(vs[(i + 1) % vs.length].pos));
    return Math.abs(s.dot(n)) / 2;
  }
  // volume, watertight mesh, no degenerate polygons
  function checkSolid(c, expected, label) {
    near(c.volume(), expected, 1e-6 * Math.max(1, Math.abs(expected)), label + ' volume');
    if (Math.abs(expected) < 1e-9) return 0;
    c.polygons.forEach(function (p, i) { assert(p.vertices.length >= 3 && polyArea3(p) > 1e-12, label + ': degenerate polygon ' + i); });
    near(K.massProps(K.meshFromBody(c), 1).volume, expected, 1e-6 * Math.max(1, expected), label + ' mesh volume');
    return c.polygons.length;
  }
  function threeOps(A, B, u, s, x, label) {
    var n = [checkSolid(A.union(B), u, label + ' union'), checkSolid(A.subtract(B), s, label + ' subtract'), checkSolid(A.intersect(B), x, label + ' intersect')];
    return 'polygons ∪ ' + n[0] + ', − ' + n[1] + ', ∩ ' + n[2];
  }
  test('boxes overlapping on one axis: 1500 / 500 / 500', function () {

      DW.driveDim(r.model, s[0], 120); DW.driveDim(r.model, s[3], 10); DW.driveDim(r.model, s[1], 6);

      var mp = K.massProps(r.mesh, 1);
      nearRel(mp.volume, 120 * 60 * 6 - 4 * polyArea(5) * 6, 1e-6, 'volume');

      var e = build('p.equations({ T: 8 }); p.box(100, 60, "=T");'), doc = DW.newDrawing(e.model, {});

      try { DW.driveDim(r.model, s[0], -1); } catch (err) { m2 = err.message; }
      assert(/equation =T/.test(m1 || '') && /positive/.test(m2 || ''), m1 + ' / ' + m2);
      return texts.join(', ') + '; volume ' + fmt(mp.volume);
    });
    test('Dimension properties on the sheet: at moves the dimension line, flip puts the arrows outside, lead moves a diameter leader, off an aligned one', function () {
      var r = annDrawing(PLATE2), F = r.view('Front'), T = r.view('Top');

    test('Balloons: a manual balloon on a part drawing is item 1 with QTY "1X"; a stacked balloon on the pinned-plate assembly shows 1 | 2 with "2X" for the pins', function () {
      var r = annDrawing(PLATE2), T = r.view('Top');

      assert(r.sheet.prims.some(function (p) { return p.layer === 'BALLOONS' && p.k === 'text' && p.text === '1X'; }), 'QTY text');
      var ex = AnvilExamples.filter(function (e) { return /Pinned plate/.test(e.name); })[0];
      var a = buildAsm(ex.code), doc = DW.newDrawing(a.model, { date: '2026-09-26' });
